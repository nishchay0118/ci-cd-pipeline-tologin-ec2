name: ci/cd pipeline to deploy docker container on ec2 instance 

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: create iamge
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app-img:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/app-img:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/app-img:latest

      - name: push image to dockerhub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/app-img:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/app-img:latest
