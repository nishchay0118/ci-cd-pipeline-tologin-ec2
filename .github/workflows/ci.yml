name: ci/cd pipeline to deploy docker container on ec2 instance 

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: create iamge
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app-img:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/app-img:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/app-img:latest

      - name: push image to dockerhub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/app-img:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/app-img:latest

      - name: login to ec2 instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PEM_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/app-img:latest
            docker stop app || true
            docker rm app || true
            docker run -d -p 80:5000 --name app ${{ secrets.DOCKER_USERNAME }}/app-img:latest 
